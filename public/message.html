<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d0a16"
    >

    <title>
        رسالة إليك 💌
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


<div class="background">

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>

    <div class="orb orb-three"></div>

</div>



<main class="home">


    <div class="brand">

        <div class="brand-icon">
            💌
        </div>

        <span>
            Solvely
        </span>

    </div>



    <section class="hero">


        <div class="hero-icon">
            💌
        </div>


        <h1>
            عندك رسالة
        </h1>


        <p>

            <span id="name">
                ...
            </span>

            ، شخص ما أرسل لك رسالة خاصة ✨

        </p>


    </section>



    <section class="result message-card">


        <div class="result-icon">
            💌
        </div>


        <h2>
            رسالة خاصة
        </h2>


        <div
            id="message"
            class="message-text"
        >
            جاري فتح الرسالة...
        </div>


        <div class="message-footer">

            وصلت إليك بمحبة ❤️

        </div>


    </section>



    <button
        id="shareButton"
        class="share-btn"
    >

        أرسل رسالة أنت أيضًا ✨

    </button>



    <div class="features">


        <div>

            <span>
                🔒
            </span>

            <p>
                خاص
            </p>

        </div>


        <div>

            <span>
                💌
            </span>

            <p>
                رسالة
            </p>

        </div>


        <div>

            <span>
                ✨
            </span>

            <p>
                Solvely
            </p>

        </div>


    </div>



    <footer>

        Solvely
        <span>•</span>
        رسالتك، بطريقتك ❤️

    </footer>


</main>



<script
    src="/message.js"
></script>


</body>

</html>
